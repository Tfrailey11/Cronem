[project]
name = "cronem"
version = "0.1.0"
description = "UofSC dining hall menu automation for Cronometer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
	"kernel",
	"keyring",
	"python-dotenv",
	"requests",
]

[project.urls]
Repository = "https://github.com/Tfrailey11/Cronem"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
Cronem = "cronem.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"cronem/API.py" = ["N999"]
"cronem/Kernel.py" = ["N999"]
"cronem/Login.py" = ["N999"]
"cronem/cli.py" = ["DTZ011"]
"cronem/main.py" = ["DTZ005"]

